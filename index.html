      <!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TCX Analytics</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- Header mit Titel und Upload-Buttons -->
  <header class="app-header">
    <h1>TCX Analytics</h1>
    <div class="file-buttons">
      <label for="tcx1File" class="btn btn-primary">TCX1</label>
      <input type="file" id="tcx1File" accept=".tcx" hidden>

      <label for="tcx2File" class="btn btn-outline">TCX2</label>
      <input type="file" id="tcx2File" accept=".tcx" hidden>
    </div>
  </header>

  <main class="container">
    <!-- Hinweiselement vor dem Upload -->
    <div id="noDataMessage" class="empty-state">
      <p>Keine TCX-Datei geladen.</p>
      <small>Tippe oben auf "TCX1", um die Hauptdatei zu laden.</small>
    </div>

    <!-- Dashboard / Auswertung -->
    <div id="dashboard" class="dashboard-content">
      
      <!-- Stats Grid -->
      <div class="stats-grid">
        <div class="stat-card">
          <span class="label">Sportart</span>
          <span class="value" id="sportVal">Running / -</span>
        </div>
        <div class="stat-card">
          <span class="label">Startzeit</span>
          <span class="value" id="startTimeVal">- / -</span>
        </div>
        <div class="stat-card">
          <span class="label">Distanz</span>
          <span class="value" id="distanceVal">- / -</span>
        </div>
        <div class="stat-card">
          <span class="label">Durchschn. Puls</span>
          <span class="value" id="avgHrVal">- / -</span>
        </div>
        <div class="stat-card">
          <span class="label">Max. Puls</span>
          <span class="value" id="maxHrVal">- / -</span>
        </div>
        <div class="stat-card">
          <span class="label">Aerober Drift</span>
          <span class="value" id="driftVal">- / -</span>
        </div>
      </div>

      <!-- Achsensteuerung -->
      <div class="controls-section">
        <div class="control-group">
          <span class="control-label">Achse Links:</span>
          <div class="button-group" id="leftAxisBtns">
            <button class="axis-btn active" data-axis="hr">Puls</button>
            <button class="axis-btn" data-axis="pace">Pace</button>
            <button class="axis-btn" data-axis="speed">km/h</button>
            <button class="axis-btn" data-axis="power">Leistung</button>
            <button class="axis-btn" data-axis="gap">GAP</button>
            <button class="axis-btn" data-axis="alt">Höhe</button>
          </div>
        </div>

        <div class="control-group">
          <span class="control-label">Achse Rechts:</span>
          <div class="button-group" id="rightAxisBtns">
            <button class="axis-btn active" data-axis="off">Aus</button>
            <button class="axis-btn" data-axis="hr">Puls</button>
            <button class="axis-btn" data-axis="pace">Pace</button>
            <button class="axis-btn" data-axis="speed">km/h</button>
            <button class="axis-btn" data-axis="power">Leistung</button>
            <button class="axis-btn" data-axis="gap">GAP</button>
          </div>
        </div>
      </div>

      <!-- Diagramm -->
      <div class="chart-container">
        <canvas id="tcxChart"></canvas>
      </div>

    </div>
  </main>

</body>
</html>
